<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>장군봉 체육관 대기 등록</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; }
        .container { max-width: 480px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: #2c3e50; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        .form-group input { width: 100%; padding: 12px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 6px; font-size: 16px; }
        .court-select-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 15px; }
        .court-btn { padding: 10px 0; border: 1px solid #2c3e50; background: white; color: #2c3e50; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; text-align: center; }
        .court-btn.active { background: #2c3e50; color: white; }
        .submit-btn { width: 100%; padding: 14px; background: #e67e22; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #d35400; }
        .alert-msg { margin-top: 15px; font-weight: bold; text-align: center; font-size: 14px; }
        .closed-notice { text-align: center; padding: 40px 0; color: #c0392b; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
<div class="container" id="mainContainer"></div>
<script>
    let selectedCourt = null;
    function getSystemData() {
        let defaultData = {
            isGlobalOpen: true,
            courts: { 1: {max:5, list:[]}, 2: {max:5, list:[]}, 3: {max:5, list:[]}, 4: {max:5, list:[]}, 5: {max:5, list:[]} }
        };
        return JSON.parse(localStorage.getItem('gym_system')) || defaultData;
    }
    function initClientScreen() {
        let sys = getSystemData();
        let container = document.getElementById('mainContainer');
        if (!sys.isGlobalOpen) {
            container.innerHTML = `<h2>장군봉 체육관 대기 등록</h2><div class="closed-notice">현재 스마트폰 대기 접수가<br>비활성화(OFF) 되었습니다.</div>`;
            return;
        }
        let myWaiting = localStorage.getItem('my_waiting_court');
        if (myWaiting) {
            container.innerHTML = `<h2 style="color:#27ae60;">대기 접수 완료</h2><div style="text-align:center; padding:20px 0; font-size:16px;">이미 <b>[${myWaiting}번 코트]</b>에 대기 중입니다.<br><span style="font-size:13px; color:#666;">체육관 현장 전광판에서 순번을 확인하세요.</span></div>`;
            return;
        }
        container.innerHTML = `<h2>장군봉 체육관 대기 등록</h2><div class="form-group"><label>성함 또는 닉네임</label><input type="text" id="clientName" placeholder="예: 김철수"></div><div class="form-group"><label>이용할 코트 선택 (1인 1코트)</label><div class="court-select-grid" id="courtBtnGrid"></div></div><button class="submit-btn" onclick="registerWaiting()">대기표 제출하기</button><div id="alertBox" class="alert-msg"></div>`;
        renderCourtButtons();
    }
    function renderCourtButtons() {
        let sys = getSystemData();
        let gridHtml = '';
        for (let i = 1; i <= 5; i++) {
            let court = sys.courts[i];
            let isFull = court.list.length >= court.max;
            let statusText = isFull ? ' (마감)' : ` (${court.list.length}/${court.max})`;
            let activeClass = (selectedCourt === i) ? 'active' : '';
            if (isFull) {
                gridHtml += `<button type="button" class="court-btn" disabled style="background:#ddd; color:#888; cursor:not-allowed;">${i}코트(마감)</button>`;
            } else {
                gridHtml += `<button type="button" class="court-btn ${activeClass}" onclick="selectCourt(${i})">${i}코트${statusText}</button>`;
            }
        }
        let btnGrid = document.getElementById('courtBtnGrid');
        if (btnGrid) btnGrid.innerHTML = gridHtml;
    }
    function selectCourt(courtNum) {
        selectedCourt = courtNum; renderCourtButtons();
    }
    function registerWaiting() {
        let nameInput = document.getElementById('clientName');
        let alertBox = document.getElementById('alertBox');
        let name = nameInput ? nameInput.value.trim() : '';
        if (!name) { alertBox.style.color = '#c0392b'; alertBox.innerText = '이름(닉네임)을 입력해주세요.'; return; }
        if (!selectedCourt) { alertBox.style.color = '#c0392b'; alertBox.innerText = '이용할 코트를 선택해주세요.'; return; }
        
        let sys = getSystemData();
        if (sys.courts[selectedCourt].list.length >= sys.courts[selectedCourt].max) {
            alertBox.style.color = '#c0392b'; alertBox.innerText = '선택하신 코트의 정원이 마감되었습니다.'; return;
        }
        sys.courts[selectedCourt].list.push(name);
        localStorage.setItem('gym_system', JSON.stringify(sys));
        localStorage.setItem('my_waiting_court', selectedCourt);
        
        alertBox.style.color = '#27ae60'; alertBox.innerText = '대기 등록 완료!';
        setTimeout(() => { location.reload(); }, 600);
    }
    window.onload = function() { initClientScreen(); };
</script>
</body>
</html>
